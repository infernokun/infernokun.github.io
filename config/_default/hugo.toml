baseURL = "https://infernokun.github.io/"
defaultContentLanguage = "en"
enableRobotsTXT = true
summaryLength = 0

[pagination]
pagerSize = 12

[outputs]
home = ["HTML", "RSS", "JSON"]

[taxonomies]
category = "categories"
tag = "tags"

# Always fill the related row: posts sharing tags or categories first, then the nearest by date.
[related]
  threshold = 0
  includeNewer = true
  toLower = false

  [[related.indices]]
    name = "tags"
    weight = 100

  [[related.indices]]
    name = "categories"
    weight = 80

  [[related.indices]]
    name = "date"
    weight = 10
